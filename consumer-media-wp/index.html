<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소비자시선 미디어 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#fafaf9;--surf:#fff;--ink:#18181b;--sub:#52525b;--mute:#6b6b73;--line:#e4e4e7;--acc:#0f6e5a;--acc-ink:#fff;--acc-soft:#e7f3ef;--hl:#fff1a8;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--surf:#1a1a1d;--ink:#f4f4f5;--sub:#c4c4c8;--mute:#9a9aa1;--line:#2c2c31;--acc:#3fb28f;--acc-ink:#0b1f19;--acc-soft:#16302a;--hl:#5c5118;--warn:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;font-size:16px;line-height:1.6;padding-bottom:30px}
a{color:inherit;text-decoration:none}img{display:block;width:100%;object-fit:cover;background:var(--line)}
button{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.demo-tag{font-size:11px;font-weight:600;color:var(--acc);background:var(--acc-soft);padding:2px 8px;border-radius:4px;white-space:nowrap}
.util{border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.util .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:12px}
.util a{margin-left:14px;white-space:nowrap}.util a:hover{color:var(--ink)}
header.top{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;height:68px;gap:28px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--acc);color:var(--acc-ink);font-size:15px}
nav.gnb{display:flex;gap:26px;font-weight:600;font-size:15px;flex:1}
nav.gnb .m{position:relative}
nav.gnb .m>a{display:block;padding:22px 0;border-bottom:2px solid transparent}
nav.gnb .m.on>a,nav.gnb .m:hover>a{border-color:var(--acc);color:var(--acc)}
nav.gnb .sub{display:none;position:absolute;top:66px;left:-14px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:170px;box-shadow:0 10px 30px rgb(15 110 90 / .08)}
nav.gnb .m:hover .sub,nav.gnb .m:focus-within .sub{display:block}
nav.gnb .sub a{display:block;padding:8px 10px;border-radius:5px;font-weight:500;font-size:14px}
nav.gnb .sub a:hover{background:var(--acc-soft);color:var(--acc)}
.sbox{display:flex;gap:6px}
.sbox input{width:200px;height:38px;padding:0 12px}
.sbtn{border:1px solid var(--line);background:var(--surf);border-radius:6px;height:38px;padding:0 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.cta{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;height:40px;padding:0 18px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.cta:active,.sbtn:active{transform:scale(.98)}
.cta.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.menu-btn{display:none}
.cat{font-size:13px;font-weight:700;color:var(--acc)}
.meta{font-size:13px;color:var(--mute);margin-top:6px}
.theme{padding:28px 0 30px;border-bottom:1px solid var(--line)}
.theme-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.theme-tabs button{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 16px;font-size:15px;font-weight:600;cursor:pointer}
.theme-tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.theme-tabs .edit{margin-left:auto;font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.theme-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:20px}
.theme-grid .big{grid-row:span 2}
.theme-grid .big img{aspect-ratio:4/3}
.tcard img{aspect-ratio:16/10;border-radius:8px}
.tcard h3{margin:8px 0 0;font-size:17px;line-height:1.4;letter-spacing:-.01em}
.tcard.big h3{font-size:26px;letter-spacing:-.03em}
.tcard p{margin:6px 0 0;color:var(--sub);font-size:15px}
.kind{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--acc);color:var(--acc);border-radius:4px;padding:0 6px;margin-right:6px}
.tcard:hover h3,.card:hover h4,.list a.item:hover h3{text-decoration:underline;text-underline-offset:3px}
h2.sec{font-size:21px;letter-spacing:-.02em;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec a{font-size:14px;color:var(--mute);font-weight:500}
.home-cols{display:grid;grid-template-columns:2fr 1fr;gap:40px;padding:32px 0;border-bottom:1px solid var(--line)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card img{aspect-ratio:4/3;border-radius:6px}
.card h4{font-size:16px;line-height:1.45;margin:8px 0 0}
.mini a{display:block;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.mini a:last-child{border:0}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:32px 0;border-bottom:1px solid var(--line)}
.rcard{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start}
.pdf{aspect-ratio:3/4;border-radius:4px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:13px}
.rcard h4{margin:2px 0 4px;font-size:16px;line-height:1.4}
.rcard p{margin:0;font-size:14px;color:var(--sub)}
.page-head{padding:30px 0 18px;border-bottom:1px solid var(--line)}
.page-head h1{margin:0;font-size:30px;letter-spacing:-.03em}
.page-head p{margin:6px 0 0;color:var(--sub)}
.crumb{font-size:13px;color:var(--mute);margin-bottom:6px}
.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tabs button,.tabs a{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tabs .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .n{font-size:12px;opacity:.7;margin-left:4px}
.sortnote{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);padding:14px 0 0}
.list a.item{display:grid;grid-template-columns:200px 1fr;gap:22px;padding:20px 0;border-bottom:1px solid var(--line)}
.list a.item.noimg{grid-template-columns:1fr}
.list a.item img{aspect-ratio:4/3;border-radius:6px}
.list a.item h3{margin:4px 0 6px;font-size:19px;line-height:1.4;letter-spacing:-.02em}
.list a.item p{margin:0;color:var(--sub);font-size:15px}
.empty{padding:56px 0;text-align:center;color:var(--mute)}
.subbox{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--acc-soft);border-radius:10px;padding:18px 20px;margin-top:20px;flex-wrap:wrap}
.subbox b{display:block;font-size:16px}.subbox span{font-size:14px;color:var(--sub)}
.subform{flex-basis:100%;display:none;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.subform.open{display:grid}
.subform .agree{grid-column:1/-1}
.article{display:grid;grid-template-columns:minmax(0,720px) 280px;gap:56px;padding:30px 0 40px}
.article h1{font-size:33px;line-height:1.3;letter-spacing:-.03em;margin:8px 0 12px}
.byline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;font-size:14px;color:var(--mute);gap:10px;flex-wrap:wrap}
.share{display:flex;gap:6px}
.share button{border:1px solid var(--line);background:var(--surf);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.body{font-size:18px;line-height:1.85}
.body figure{margin:24px 0}.body figure img{border-radius:8px;aspect-ratio:16/9}
.body figcaption{font-size:14px;color:var(--mute);margin-top:8px;padding-left:10px;border-left:2px solid var(--line)}
.body blockquote{margin:26px 0;padding:6px 0 6px 20px;border-left:4px solid var(--acc);font-size:20px;font-weight:600;line-height:1.6}
.body blockquote cite{display:block;font-size:14px;font-weight:400;color:var(--mute);font-style:normal;margin-top:6px}
.body mark,.ed mark{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 1px}
.attach{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:16px;margin:24px 0;flex-wrap:wrap}
.attach .pdf{width:44px}
.attach div{flex:1;font-size:14px;min-width:160px}.attach b{display:block;font-size:15px}
.contact-box{background:var(--acc-soft);border-radius:8px;padding:16px 18px;font-size:14px;margin-top:20px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:20px}
.tags a{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--sub)}
aside.rail h3{font-size:15px;margin:0 0 4px}
aside.rail .sticky{position:sticky;top:96px}
aside.rail .mini a{font-size:14px}
.viewer{background:#3f3f46;border-radius:10px;padding:16px;margin:20px 0 10px}
.vbar{display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;margin-bottom:12px;flex-wrap:wrap}
.vbar button{background:#52525b;border:0;color:#fff;border-radius:5px;height:34px;min-width:34px;padding:0 10px;cursor:pointer}
.vbar button:disabled{opacity:.4;cursor:default}
.vbar .sp{flex:1}
.vbar input{width:52px;height:34px;padding:0 6px;text-align:center;background:#27272a;color:#fff;border:1px solid #52525b}
.vpage-wrap{overflow:auto;display:flex;justify-content:center}
.vpage{background:#fff;color:#18181b;width:min(100%,640px);aspect-ratio:1/1.414;padding:7% 8%;font-size:15px;line-height:1.7;box-shadow:0 6px 24px rgb(0 0 0 / .35);transform-origin:top center;flex:none;overflow:hidden}
.vpage h2{font-size:1.5em;margin:0 0 .6em;letter-spacing:-.02em;line-height:1.3}
.vpage .pno{font-size:12px;color:#71717a;text-align:right;margin-top:1.2em}
.vpage .bar{height:12px;background:#0f6e5a;border-radius:2px;margin:6px 0}
.vpage table{width:100%;border-collapse:collapse;font-size:.9em}.vpage td{border-bottom:1px solid #d4d4d8;padding:5px 2px;text-align:left}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.thumbs button{flex:none;width:38px;height:52px;background:#fff;border:2px solid transparent;border-radius:3px;font-size:11px;color:#3f3f46;cursor:pointer}
.thumbs button.on{border-color:#3fb28f}
.admin-bar{background:#27272a;color:#e4e4e7;font-size:13px}
.admin-bar .wrap{display:flex;align-items:center;gap:14px;height:34px;white-space:nowrap;overflow-x:auto}
.admin-bar a{color:#fff;font-weight:600}
.adm{display:grid;grid-template-columns:220px 1fr;gap:32px;padding:30px 0 40px}
.adm nav a{display:block;padding:10px 12px;border-radius:6px;font-weight:600;font-size:15px}
.adm nav a.on{background:var(--acc-soft);color:var(--acc)}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0}
.panel h2{margin:0 0 4px;font-size:20px}
.panel>p{margin:0 0 18px;color:var(--sub);font-size:14px}
.tagrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.tagrow input[type=checkbox]{width:18px;height:18px}
.tagrow .cnt{font-size:13px;color:var(--mute)}
.tagrow button{border:1px solid var(--line);background:var(--surf);border-radius:5px;height:30px;padding:0 8px;cursor:pointer}
.ed-tools{display:flex;gap:6px;flex-wrap:wrap;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:8px;background:var(--bg)}
.ed-tools button{border:1px solid var(--line);background:var(--surf);border-radius:5px;height:34px;padding:0 12px;font-size:14px;cursor:pointer}
.ed{border:1px solid var(--line);border-radius:0 0 8px 8px;min-height:300px;padding:20px;font-size:17px;line-height:1.8;background:var(--surf)}
.ed:focus{outline:2px solid var(--acc);outline-offset:1px}
.ed figure{margin:16px 0}.ed figure img{border-radius:6px;aspect-ratio:16/9}
.ed figcaption{font-size:14px;color:var(--mute);margin-top:6px;padding-left:10px;border-left:2px solid var(--line)}
.ed blockquote{margin:16px 0;padding:4px 0 4px 18px;border-left:4px solid var(--acc);font-weight:600}
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:6px}
.edgrid h3{font-size:14px;color:var(--mute);margin:0 0 8px}
.prev{border:1px dashed var(--line);border-radius:8px;padding:20px;min-height:300px}
.prev .body{font-size:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surf);border:1px solid #a1a1aa;border-radius:6px;padding:9px 12px;width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.err{font-size:13px;color:var(--warn);font-weight:500}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--sub);font-weight:400}
.agree input{width:17px;height:17px;margin-top:2px;flex:none}
.about{display:grid;grid-template-columns:200px 1fr;gap:40px;padding:30px 0 40px}
.about nav a{display:block;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600}
.about nav a.on{color:var(--acc)}
.org{display:grid;gap:10px;justify-items:center}
.org .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.org span{border:1px solid var(--line);background:var(--surf);border-radius:6px;padding:10px 16px;font-weight:600}
.org span.top{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.hist div{display:grid;grid-template-columns:90px 1fr;padding:10px 0;border-bottom:1px solid var(--line)}
.hist b{color:var(--acc)}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:600;font-size:16px}
details p{margin:10px 0 0;color:var(--sub)}
.wpmemo{border:1px dashed var(--acc);border-radius:8px;padding:16px 18px;margin:24px 0 20px;font-size:14px;background:var(--surf)}
.wpmemo b{color:var(--acc)}
.wpmemo ul{margin:6px 0 0;padding-left:18px;color:var(--sub)}
footer.ft{border-top:1px solid var(--line);padding:28px 0;font-size:13px;color:var(--mute)}
footer.ft .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
main{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}.toast{transition:none}}
@media (max-width:960px){
 nav.gnb{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;gap:0;background:var(--surf);border-bottom:1px solid var(--line);padding:0 20px 10px}
 nav.gnb.open{display:flex}
 nav.gnb .m>a{padding:12px 0 4px;border:0}
 nav.gnb .sub{display:flex!important;flex-wrap:wrap;position:static;border:0;box-shadow:none;padding:0 0 8px;min-width:0;background:none}
 nav.gnb .sub a{padding:6px 10px 6px 0;color:var(--sub)}
 .menu-btn{display:inline-flex;align-items:center}
 header.top .wrap{gap:10px;justify-content:space-between}
 header.top .sbox input{display:none}
 .theme-grid,.home-cols,.lib,.article,.adm,.edgrid,.about{grid-template-columns:1fr;gap:22px}
 .theme-grid .big{grid-row:auto}
 .tcard.big h3{font-size:22px}
 .grid3{grid-template-columns:1fr 1fr;gap:14px}
 .article h1{font-size:25px}
 .list a.item{grid-template-columns:104px 1fr;gap:14px}
 .list a.item.noimg{grid-template-columns:1fr}
 .list a.item h3{font-size:17px}.list a.item p{display:none}
 .util .hide-m{display:none}
 .body{font-size:17px}
 .subform{grid-template-columns:1fr}
 .vpage{font-size:11px}
 .theme-tabs .edit{margin-left:0}
 .adm nav{display:flex;gap:6px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="admin-bar"><div class="wrap"><span class="demo-tag" style="background:#3f3f46;color:#d4d4d8">관리자 미리보기</span><a href="#/admin/tags">메인 해시태그 지정</a><a href="#/admin/editor">기사 에디터</a></div></div>
<div class="util"><div class="wrap"><span><span class="hide-m">소비자 권익을 지키는 비영리 단체 </span><span class="demo-tag">가상 단체 시연</span></span><span><a href="#/c/press">기자 구독</a><a href="#/about/map">오시는 길</a></span></div></div>
<header class="top"><div class="wrap">
 <a class="logo" href="#/"><b>시</b>소비자시선</a>
 <nav class="gnb" id="gnb"></nav>
 <form class="sbox" onsubmit="event.preventDefault();location.hash='#/search/'+encodeURIComponent(this.q.value)"><input name="q" placeholder="통합 검색" aria-label="통합 검색어"><button class="sbtn">검색</button></form>
 <button class="sbtn menu-btn" onclick="gnb.classList.toggle('open')" aria-label="메뉴">메뉴</button>
</div></header>
<main id="app"></main>
<footer class="ft"><div class="wrap"><span>소비자시선 (가상 단체) · 서울특별시 OO구 OO로 00</span><span>개인정보처리방침 · 이메일무단수집거부 · 회원가입 없이 모든 자료 공개</span></div></footer>
<div class="toast" id="toast"></div>
<script>
const BOARDS={press:'보도자료·성명',forum:'토론회·포럼',policy:'정책 자료',brief:'소비자보고서 Brief·칼럼',journal:'저널',notice:'공지사항',faq:'FAQ'};
const PRESS_CATS=['AI','통신','플랫폼·문화','자동차','식품·과학','사회'];
const MENU=[
 {t:'단체소개',k:'about',href:'#/about/greet',sub:[['인사말','#/about/greet'],['연혁','#/about/hist'],['조직도','#/about/org'],['오시는 길','#/about/map']]},
 {t:'소비자 활동',k:'act',href:'#/c/press',sub:[['보도자료·성명','#/c/press'],['토론회·포럼','#/c/forum']]},
 {t:'소비자 정보',k:'info',href:'#/c/policy',sub:[['정책 자료','#/c/policy'],['Brief·칼럼','#/c/brief'],['저널','#/c/journal']]},
 {t:'공지',k:'news',href:'#/c/notice',sub:[['공지사항','#/c/notice'],['FAQ','#/c/faq']]}];
const GROUP={press:'act',forum:'act',policy:'info',brief:'info',journal:'info',notice:'news',faq:'news'};
const SEARCH_TABS=[['press','보도자료',['press','forum']],['notice','공지',['notice']],['lib','자료실',['policy','brief','journal']],['faq','FAQ',['faq']]];
const P=(s,w=800,h=600)=>`https://picsum.photos/seed/cs-${s}/${w}/${h}`;
