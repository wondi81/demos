<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소비자시선 미디어 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#fafaf9;--surf:#fff;--ink:#18181b;--sub:#52525b;--mute:#71717a;--line:#e4e4e7;--acc:#0f6e5a;--acc-ink:#fff;--acc-soft:#e7f3ef;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--surf:#1a1a1d;--ink:#f4f4f5;--sub:#c4c4c8;--mute:#9a9aa1;--line:#2c2c31;--acc:#3fb28f;--acc-ink:#0b1f19;--acc-soft:#16302a;--warn:#f97066}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;font-size:16px;line-height:1.6;padding-bottom:30px}
a{color:inherit;text-decoration:none}img{display:block;width:100%;object-fit:cover;background:var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.demo-tag{font-size:11px;font-weight:600;color:var(--acc);background:var(--acc-soft);padding:2px 8px;border-radius:4px;white-space:nowrap}
/* header */
.util{border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.util .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:12px}
.util a{margin-left:14px;white-space:nowrap}.util a:hover{color:var(--ink)}
header.top{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;height:68px;gap:28px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--acc);color:var(--acc-ink);font-size:15px}
nav.gnb{display:flex;gap:22px;font-weight:600;font-size:15px;flex:1}
nav.gnb a{padding:22px 0;border-bottom:2px solid transparent}
nav.gnb a.on,nav.gnb a:hover{border-color:var(--acc);color:var(--acc)}
.sbtn{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;height:38px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.cta{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;height:40px;padding:0 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center}
.cta:active,.sbtn:active{transform:scale(.98)}
.cta.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.menu-btn{display:none}
/* home */
.lead{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;padding:32px 0 36px;border-bottom:1px solid var(--line)}
.lead .main img{aspect-ratio:16/9;border-radius:8px}
.cat{font-size:13px;font-weight:700;color:var(--acc)}
.lead .main h1{font-size:32px;line-height:1.3;letter-spacing:-.03em;margin:10px 0 8px}
.lead .main p{color:var(--sub);margin:0;max-width:62ch}
.meta{font-size:13px;color:var(--mute);margin-top:8px}
.side h3{font-size:14px;margin:0 0 6px;color:var(--mute);font-weight:600}
.side a.row{display:grid;grid-template-columns:1fr 96px;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.side a.row:last-child{border:0}
.side a.row h4{margin:4px 0 0;font-size:16px;line-height:1.4}
.side a.row img{aspect-ratio:1;border-radius:6px}
h2.sec{font-size:22px;letter-spacing:-.02em;margin:0;display:flex;justify-content:space-between;align-items:baseline}
h2.sec a{font-size:14px;color:var(--mute);font-weight:500}
section.block{padding:36px 0;border-bottom:1px solid var(--line)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:18px}
.card img{aspect-ratio:4/3;border-radius:6px}
.card h4{font-size:17px;line-height:1.4;margin:10px 0 0}
.card:hover h4,.side a.row:hover h4,.lead .main:hover h1{text-decoration:underline;text-underline-offset:3px}
.research{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.rcard{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:start}
.pdf{aspect-ratio:3/4;border-radius:4px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:13px}
.rcard h4{margin:4px 0 6px;font-size:17px;line-height:1.4}
.rcard p{margin:0;font-size:14px;color:var(--sub)}
.band{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:36px 0}
.band > a{border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.band .b1{background:var(--acc);color:var(--acc-ink)}
.band .b2{background:var(--surf);border:1px solid var(--line)}
.band h3{margin:0;font-size:22px;letter-spacing:-.02em}
.band p{margin:0;opacity:.85;max-width:44ch}
.band .go{margin-top:auto;font-weight:700}
/* list */
.page-head{padding:32px 0 18px;border-bottom:1px solid var(--line)}
.page-head h1{margin:0;font-size:30px;letter-spacing:-.03em}
.page-head p{margin:6px 0 0;color:var(--sub)}
.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list a.item{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.list a.item img{aspect-ratio:4/3;border-radius:6px}
.list a.item h3{margin:4px 0 6px;font-size:20px;line-height:1.4;letter-spacing:-.02em}
.list a.item p{margin:0;color:var(--sub);font-size:15px}
.pager{display:flex;gap:6px;justify-content:center;padding:28px 0}
.pager span{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);font-size:14px}
.pager span.on{background:var(--ink);color:var(--bg)}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
/* article */
.article{display:grid;grid-template-columns:minmax(0,720px) 300px;gap:56px;padding:32px 0 48px}
.crumb{font-size:13px;color:var(--mute)}
.article h1{font-size:34px;line-height:1.3;letter-spacing:-.03em;margin:10px 0 12px}
.byline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;font-size:14px;color:var(--mute);gap:10px;flex-wrap:wrap}
.share{display:flex;gap:6px}
.share button{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.body{font-size:18px;line-height:1.85}
.body figure{margin:24px 0}.body figure img{border-radius:8px;aspect-ratio:16/9}
.body figcaption{font-size:13px;color:var(--mute);margin-top:6px}
.body blockquote{margin:24px 0;padding:4px 0 4px 18px;border-left:3px solid var(--acc);color:var(--sub)}
.attach{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:16px;margin:24px 0}
.attach .pdf{width:44px}
.attach div{flex:1;font-size:14px}.attach b{display:block;font-size:15px}
.contact-box{background:var(--acc-soft);border-radius:8px;padding:16px 18px;font-size:14px;margin-top:20px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:20px}
.tags a{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--sub)}
aside.rail h3{font-size:15px;margin:0 0 4px}
aside.rail a{display:block;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
aside.rail .sticky{position:sticky;top:96px}
.rail-cta{margin-top:24px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:18px}
.rail-cta a.cta{display:inline-flex;padding:0 18px;border:0}
.rail-cta p{margin:4px 0 12px;font-size:14px;color:var(--sub)}
/* search */
.sbar{display:flex;gap:8px;margin-top:16px;max-width:640px}
.sbar input{flex:1}
mark{background:var(--acc-soft);color:var(--acc);padding:0 2px}
/* forms */
.formwrap{display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:56px;padding:32px 0 48px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field label{font-weight:600;font-size:14px}
.field .help{font-size:13px;color:var(--mute)}
.field .err{font-size:13px;color:var(--warn);min-height:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surf);border:1px solid #a1a1aa;border-radius:6px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
textarea{min-height:140px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{font-weight:500;border:1px solid var(--line);background:var(--surf);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:15px}
.chips input{display:none}
.chips label:has(input:checked){border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:700}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--sub)}
.agree input{width:18px;height:18px;margin-top:3px;flex:none}
.done{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:28px}
.done h3{margin:0 0 6px;font-size:22px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:12px 0 12px 40px;position:relative;border-bottom:1px solid var(--line);font-size:15px}
.steps li::before{content:counter(s);position:absolute;left:0;top:12px;width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:700;display:grid;place-items:center;font-size:13px}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amounts label{text-align:center}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:32px 0 48px;align-items:start}
.about-grid img{border-radius:8px;aspect-ratio:4/3}
.hist{margin-top:10px}
.hist div{display:grid;grid-template-columns:70px 1fr;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist b{color:var(--acc)}
/* wp memo */
.wpmemo{border:1px dashed var(--acc);border-radius:8px;padding:16px 18px;margin:28px 0 20px;font-size:14px;background:var(--surf)}
.wpmemo b{color:var(--acc)}
.wpmemo ul{margin:6px 0 0;padding-left:18px;color:var(--sub)}
footer.ft{border-top:1px solid var(--line);padding:28px 0;font-size:13px;color:var(--mute)}
footer.ft .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
main{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}.toast{transition:none}}
/* mobile */
@media (max-width:900px){
 nav.gnb{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;gap:0;background:var(--surf);border-bottom:1px solid var(--line);padding:0 20px}
 nav.gnb.open{display:flex}nav.gnb a{padding:14px 0;border-bottom:1px solid var(--line)}
 .menu-btn{display:inline-flex;align-items:center}
 header.top .wrap{gap:10px;justify-content:space-between}
 header.top .cta{display:none}
 .lead,.article,.formwrap,.about-grid,.band,.research{grid-template-columns:1fr;gap:24px}
 .grid4{grid-template-columns:1fr 1fr;gap:16px}
 .lead .main h1,.article h1{font-size:25px}
 .list a.item{grid-template-columns:110px 1fr;gap:14px}
 .list a.item h3{font-size:17px}.list a.item p{display:none}
 .util .hide-m{display:none}
 .body{font-size:17px}
 .two{grid-template-columns:1fr}
 .amounts{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="util"><div class="wrap"><span><span class="hide-m">소비자 권익을 지키는 비영리 단체 </span><span class="demo-tag">가상 단체 시연</span></span><span><a href="#/about" class="hide-m">단체소개</a><a href="#/support">회원가입</a><a href="#/support">후원하기</a></span></div></div>
<header class="top"><div class="wrap">
 <a class="logo" href="#/"><b>시</b>소비자시선</a>
 <nav class="gnb" id="gnb">
  <a href="#/c/press" data-k="press">보도자료</a>
  <a href="#/c/research" data-k="research">연구·조사</a>
  <a href="#/c/issue" data-k="issue">소비자 이슈</a>
  <a href="#/report" data-k="report">제보·상담</a>
  <a href="#/about" data-k="about">단체소개</a>
 </nav>
 <button class="sbtn" onclick="location.hash='#/search'" aria-label="검색">검색</button>
 <a class="cta" href="#/support">후원하기</a>
 <button class="sbtn menu-btn" onclick="gnb.classList.toggle('open')" aria-label="메뉴">메뉴</button>
</div></header>
<main id="app"></main>
<footer class="ft"><div class="wrap"><span>소비자시선 (가상 단체) · 서울특별시 OO구 OO로 00 · 고유번호 000-00-00000</span><span>개인정보처리방침 · 이메일무단수집거부 · 기부금 영수증 안내</span></div></footer>
<div class="toast" id="toast"></div>
<script>
const CATS={press:'보도자료',research:'연구·조사',issue:'소비자 이슈',notice:'공지'};
const P=(s,w=800,h=600)=>`https://picsum.photos/seed/cs-${s}/${w}/${h}`;
const A=[
 {id:1,c:'press',t:'배달앱 3사 최소주문금액 1년 새 평균 11.6% 올라',s:'수도권 음식점 1,240곳 가격을 1년간 추적한 결과, 최소주문금액과 배달팁이 함께 오른 곳이 절반을 넘었습니다.',d:'2026.10.21',a:'정책팀 한서윤',img:'delivery',tag:['배달앱','가격조사'],pdf:'배달앱_가격추적_보고서.pdf'},
 {id:2,c:'research',t:'2026 구독서비스 해지 절차 실태조사 보고서',s:'OTT·음원·쇼핑 멤버십 32개 서비스의 해지 단계 수와 위약 안내 방식을 비교했습니다.',d:'2026.10.17',a:'조사연구실',img:'subscribe',tag:['구독','해지방해'],pdf:'구독해지_실태조사_2026.pdf'},
 {id:3,c:'issue',t:'중고거래 안전결제 사칭 문자, 이렇게 구별하세요',s:'최근 접수된 사칭 링크 제보 84건을 유형별로 정리했습니다.',d:'2026.10.15',a:'상담센터 문태경',img:'phone',tag:['중고거래','사기예방']},
 {id:4,c:'press',t:'헬스장 장기 회원권 환불 거부, 공정위에 조사 요청',s:'환불 규정 미고지 사례가 반복된 업체 6곳에 대해 조사를 요청했습니다.',d:'2026.10.13',a:'정책팀 한서윤',img:'gym',tag:['환불','공정위']},
 {id:5,c:'research',t:'유아용 물티슈 18종 보존제 성분 비교 시험',s:'공인 시험기관에 의뢰해 표시 성분과 실제 검출 성분을 대조했습니다.',d:'2026.10.08',a:'조사연구실',img:'baby',tag:['생활화학','시험결과'],pdf:'물티슈_성분비교_시험결과.pdf'},
 {id:6,c:'issue',t:'항공권 유류할증료, 환불 때 돌려받을 수 있을까',s:'항공사별 약관을 비교하고 실제 상담 사례로 정리했습니다.',d:'2026.10.06',a:'상담센터 문태경',img:'airport',tag:['항공','환불']},
 {id:7,c:'press',t:'온라인 쇼핑몰 "품절 임박" 표시 47%가 실제 재고와 달라',s:'다크패턴 모니터링 3분기 결과를 발표합니다.',d:'2026.10.02',a:'디지털소비자팀',img:'shopping',tag:['다크패턴','온라인쇼핑'],pdf:'다크패턴_3분기_모니터링.pdf'},
 {id:8,c:'research',t:'고령 소비자 키오스크 이용 불편 설문 결과',s:'65세 이상 소비자 612명을 대상으로 한 설문 결과입니다.',d:'2026.09.26',a:'조사연구실',img:'kiosk',tag:['고령소비자','디지털포용'],pdf:'키오스크_고령소비자_설문.pdf'},
 {id:9,c:'issue',t:'전세 계약 전 꼭 확인할 서류 다섯 가지',s:'주거 상담에서 가장 많이 나온 질문을 정리했습니다.',d:'2026.09.22',a:'상담센터',img:'house',tag:['주거','계약']},
 {id:10,c:'notice',t:'2026 소비자 권익 포럼 참가 신청 안내',s:'11월 정기 포럼의 주제와 신청 방법을 안내합니다.',d:'2026.09.19',a:'사무국',img:'forum',tag:['행사']},
 {id:11,c:'press',t:'택배 분실 보상 기준, 업체마다 최대 3배 차이',s:'주요 택배사 7곳의 분실·파손 보상 약관을 비교했습니다.',d:'2026.09.15',a:'정책팀',img:'parcel',tag:['택배','약관']},
 {id:12,c:'notice',t:'정기총회 결과 및 2027년 사업계획 공개',s:'총회 의결 사항과 결산 자료를 공개합니다.',d:'2026.09.10',a:'사무국',img:'meeting',tag:['공시'],pdf:'2026_정기총회_결과.pdf'}
];
const $=s=>document.querySelector(s),app=$('#app');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1800)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
