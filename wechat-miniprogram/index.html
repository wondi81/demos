<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>韩游通 미니프로그램 시연</title>
<meta name="description" content="방한 중화권 관광객 대상 할인권·예약 안내 위챗 미니프로그램 화면 흐름 시연 (가상 데이터)">
<style>
:root{
  --wx:#07C160; --wx-d:#06AD56; --wx-l:#E8F8EF;
  --bg:#F4F5F7; --page:#EEF0F3; --card:#fff; --ink:#191919; --ink2:#5F6368; --ink3:#9AA0A6;
  --line:#ECEDEF; --orange:#FF5B32; --orange-l:#FFF1EC; --gold:#FFB020;
  --admin-ink:#1F2933; --admin-line:#E3E7EC;
  --cn:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --ko:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--admin-ink);font-family:var(--ko);font-size:14px;line-height:1.5;padding-top:30px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.band{position:fixed;top:0;left:0;right:0;z-index:99;height:30px;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-size:12px;letter-spacing:.12em;font-weight:600}
.intro{max-width:1240px;margin:16px auto 0;padding:0 16px}
.intro p{background:#fff;border:1px solid var(--admin-line);border-left:4px solid var(--wx);border-radius:10px;padding:12px 16px;font-size:14px;color:#334}
.wrap{max-width:1240px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:420px 1fr;gap:24px;align-items:start}
.wrap>*{min-width:0}
footer{max-width:1240px;margin:8px auto 32px;padding:0 16px;color:#7b8794;font-size:12px;text-align:center}

/* ---------- phone ---------- */
.phone-col{position:sticky;top:40px}
.phone{width:390px;height:800px;margin:0 auto;border-radius:48px;background:#111;padding:10px;box-shadow:0 30px 60px -20px rgba(16,24,40,.35),0 0 0 1px #2a2a2a inset}
.screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;font-family:var(--cn);color:var(--ink)}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:600;background:var(--navbg,#fff)}
.status .sys{display:flex;gap:5px;align-items:center}
.nav{height:44px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;background:var(--navbg,#fff);font-size:16px;font-weight:600}
.nav .back{position:absolute;left:6px;top:6px;width:32px;height:32px;display:grid;place-items:center}
.nav .back[hidden]{display:none}
.nav h1{font-size:16px;font-weight:600;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capsule{position:absolute;right:8px;top:6px;width:87px;height:32px;border-radius:16px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.7);display:flex;align-items:center}
.capsule span{flex:1;display:grid;place-items:center;height:100%}
.capsule i{width:1px;height:18px;background:rgba(0,0,0,.14)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.body::-webkit-scrollbar{display:none}
.tabbar{flex:none;height:62px;padding-bottom:10px;display:flex;background:#fff;border-top:1px solid var(--line)}
.tabbar[hidden]{display:none}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#7A7E83}
.tabbar button.on{color:var(--wx)}
.tabbar svg{width:24px;height:24px}

.pad{padding:12px}
.search{display:flex;align-items:center;gap:6px;height:36px;border-radius:18px;background:#fff;padding:0 14px;color:var(--ink3);font-size:13px}
.hero{margin-top:10px;border-radius:14px;overflow:hidden;position:relative;height:132px}
.hero svg{display:block;width:100%;height:100%}
.hero .txt{position:absolute;left:16px;top:18px;color:#fff}
.hero .txt b{display:block;font-size:19px;letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.hero .txt small{display:inline-block;margin-top:6px;font-size:11px;background:rgba(255,255,255,.22);border-radius:10px;padding:2px 8px}
.trust{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--ink2)}
.trust span{display:flex;align-items:center;gap:3px}
.cats{margin-top:12px;background:#fff;border-radius:14px;padding:14px 4px 10px;display:grid;grid-template-columns:repeat(5,1fr)}
.cats button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink)}
.cats .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.cats .ic svg{width:26px;height:26px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px}
.sec h2{font-size:16px;font-weight:700}
.sec a{font-size:12px;color:var(--ink3);cursor:pointer}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mini-cp{flex:none;width:150px;border-radius:10px;background:linear-gradient(135deg,#FF7A45,#FF4D2E);color:#fff;padding:10px 12px;position:relative;cursor:pointer}
.mini-cp b{font-size:17px;display:block}
.mini-cp span{font-size:11px;opacity:.92;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-cp::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}

.shop{display:flex;gap:10px;background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer;transition:transform .12s}
.shop:active{transform:scale(.985)}
.shop .th{width:92px;height:92px;flex:none;border-radius:8px;overflow:hidden}
.shop .th svg{width:100%;height:100%;display:block}
.shop .inf{flex:1;min-width:0;display:flex;flex-direction:column}
.shop .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--orange);margin-top:3px}
.rate em{font-style:normal;color:var(--ink3)}
.meta{font-size:12px;color:var(--ink2);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:10px;line-height:16px;padding:0 5px;border-radius:3px;background:#F2F3F5;color:var(--ink2)}
.tag.g{background:var(--wx-l);color:var(--wx-d)}
.tag.o{background:var(--orange-l);color:var(--orange)}
.from{margin-top:auto;font-size:12px;color:var(--ink3)}
.from b{color:var(--orange);font-size:15px}

.chips{display:flex;gap:8px;padding:10px 12px;background:#fff;position:sticky;top:0;z-index:2}
.chip{padding:4px 12px;border-radius:14px;background:#F2F3F5;font-size:12px;color:var(--ink2)}
.chip.on{background:var(--wx-l);color:var(--wx-d);font-weight:600}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:40px 0}

.dhero{height:210px;position:relative}
.dhero svg{width:100%;height:100%;display:block}
.dcard{background:#fff;border-radius:14px 14px 0 0;margin-top:-16px;position:relative;padding:16px}
.dcard h2{font-size:19px;font-weight:700}
.info{background:#fff;margin-top:8px;padding:4px 16px}
.info .row{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:13px;border-bottom:1px solid var(--line)}
.info .row:last-child{border:0}
.info .row svg{flex:none;color:var(--ink2)}
.info .row span{flex:1}
.block{background:#fff;margin-top:8px;padding:14px 16px}
.block h3{font-size:15px;font-weight:700;margin-bottom:6px}
.prod{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;transition:border-color .15s,background .15s}
.prod.on{border-color:var(--wx);background:#F6FCF8}
.prod .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid #C8CBD0;flex:none;display:grid;place-items:center}
.prod.on .rd{border-color:var(--wx);background:var(--wx)}
.prod .pn{flex:1;font-size:14px}
.prod .pp{text-align:right}
.prod .pp b{display:block;color:var(--orange);font-size:15px}
.prod .pp small{color:var(--ink3);font-size:11px}
.cpline{display:flex;align-items:center;justify-content:space-between;background:var(--orange-l);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:13px;color:var(--orange)}
.cpline button{font-size:12px;color:#fff;background:var(--orange);border-radius:12px;padding:2px 10px}
.note{font-size:12px;color:var(--ink3);padding:12px 16px 20px;line-height:1.7}
.actbar{flex:none;height:72px;padding:8px 12px 18px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;z-index:5}
.actbar .ib{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--ink2);width:34px}
.btn{height:44px;border-radius:22px;background:var(--wx);color:#fff;font-size:16px;font-weight:600;flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--wx-d)}
.btn.ghost{background:#fff;color:var(--wx);border:1px solid var(--wx)}

/* chat */
.chat{background:#EDEDED;min-height:100%;padding:8px 12px 16px}
.sys-tip{text-align:center;font-size:11px;color:#9a9a9a;margin:10px 0}
.sys-tip span{background:#DADADA;color:#fff;border-radius:4px;padding:2px 6px}
.msg{display:flex;gap:8px;margin:12px 0;align-items:flex-start;animation:pop .25s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:38px;height:38px;border-radius:6px;flex:none;overflow:hidden}
.bub{max-width:230px;background:#fff;border-radius:6px;padding:9px 11px;font-size:14px;line-height:1.55;position:relative;word-break:break-word}
.msg.me .bub{background:#95EC69}
.bub::before{content:"";position:absolute;top:13px;left:-5px;border:5px solid transparent;border-left:0;border-right-color:#fff}
.msg.me .bub::before{left:auto;right:-5px;border:5px solid transparent;border-right:0;border-left-color:#95EC69}
.mpcard{width:230px;background:#fff;border-radius:6px;overflow:hidden}
.mpcard .h{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);padding:8px 10px 4px}
.mpcard .t{font-size:14px;font-weight:600;padding:0 10px}
.mpcard .p{font-size:12px;color:var(--ink2);padding:2px 10px 0}
.mpcard .im{height:110px;margin:8px 10px 0;border-radius:4px;overflow:hidden}
.mpcard .im svg{width:100%;height:100%;display:block}
.mpcard .f{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding:6px 10px;font-size:11px;color:var(--ink3)}
.mpcard .f b{color:var(--orange);font-size:13px}
.typing{display:inline-flex;gap:3px}
.typing i{width:6px;height:6px;border-radius:50%;background:#bbb;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 46px}
.quick button{background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;color:var(--wx-d);border:1px solid #CDEFD9}
.inputbar{flex:none;background:#F7F7F7;border-top:1px solid #DCDCDC;padding:8px 10px 20px;display:flex;gap:8px;align-items:center;z-index:5}
.inputbar input{flex:1;height:36px;border-radius:6px;border:0;background:#fff;padding:0 10px;font-size:16px;outline:none}
.inputbar button{height:34px;padding:0 14px;border-radius:5px;background:var(--wx);color:#fff;font-size:14px}

/* coupons */
.seg{display:flex;background:#fff;position:sticky;top:0;z-index:2}
.seg button{flex:1;height:44px;font-size:14px;color:var(--ink2);position:relative}
.seg button.on{color:var(--ink);font-weight:700}
.seg button.on::after{content:"";position:absolute;left:50%;bottom:6px;width:22px;height:3px;border-radius:2px;background:var(--wx);transform:translateX(-50%)}
.cp{display:flex;background:#fff;border-radius:10px;margin-bottom:10px;overflow:hidden;position:relative}
.cp .l{width:104px;flex:none;background:linear-gradient(160deg,#FF7A45,#FF4D2E);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center}
.cp .l b{font-size:20px;line-height:1.2}
.cp .l small{font-size:11px;opacity:.9}
.cp .r{flex:1;padding:10px 12px;min-width:0;border-left:1px dashed #F2C4B5;display:flex;flex-direction:column}
.cp .r .n{font-size:14px;font-weight:600}
.cp .r .s{font-size:12px;color:var(--ink2);margin-top:2px}
.cp .r .v{font-size:11px;color:var(--ink3);margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between}
.cp .take{font-size:12px;border-radius:13px;padding:3px 12px;background:var(--orange);color:#fff}
.cp .take[disabled]{background:#F2F3F5;color:var(--ink3)}
.cp.used .l{background:#C9CDD2}
.cp.used .r .n{color:var(--ink3)}
.stamp{position:absolute;right:10px;top:8px;font-size:11px;border:1.5px solid currentColor;border-radius:4px;padding:0 5px;transform:rotate(-8deg)}
.stamp.ok{color:var(--wx)} .stamp.no{color:#B0B4B9}

.cpd{margin:12px;background:#fff;border-radius:14px;overflow:hidden;text-align:center}
.cpd .top{background:linear-gradient(160deg,#FF7A45,#FF4D2E);color:#fff;padding:18px 16px}
.cpd .top b{font-size:26px;display:block}
.cpd .qr{width:176px;height:176px;margin:18px auto 6px;padding:8px;border:1px solid var(--line);border-radius:8px;position:relative}
.cpd .qr svg{width:100%;height:100%;display:block}
.cpd .qr.dim::after{content:"已使用";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.86);font-size:20px;font-weight:700;color:var(--wx)}
.code{font-size:26px;font-weight:700;letter-spacing:.28em;font-variant-numeric:tabular-nums;margin-top:4px}
.cpd .rules{text-align:left;font-size:12px;color:var(--ink2);padding:12px 16px 16px;border-top:1px dashed var(--line);margin-top:14px;line-height:1.8}

.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:18px 18px 30px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{font-size:17px;text-align:center}
.sheet p{font-size:12px;color:var(--ink3);text-align:center;margin-top:4px}
.pin{display:flex;gap:10px;justify-content:center;margin:18px 0 8px}
.pin input{width:200px;height:48px;text-align:center;font-size:24px;letter-spacing:.5em;border:1.5px solid var(--line);border-radius:10px;outline:none;font-variant-numeric:tabular-nums}
.pin input:focus{border-color:var(--wx)}
.pin.err input{border-color:#FA5151;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.errmsg{color:#FA5151;font-size:12px;text-align:center;min-height:18px}
.demo-hint{background:#FFF8E6;border-radius:8px;padding:8px 10px;font-size:12px;color:#8A6200;margin:6px 0 14px;text-align:center}

.toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(17,17,17,.82);color:#fff;border-radius:10px;padding:14px 18px;font-size:14px;z-index:30;text-align:center;min-width:120px;max-width:240px;animation:fade .15s}
.toast svg{display:block;margin:0 auto 6px}

.me-head{background:linear-gradient(180deg,#fff,#F4F5F7);padding:20px 16px;display:flex;gap:12px;align-items:center}
.me-head .av{width:58px;height:58px;border-radius:50%}
.me-head b{font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;margin:0 12px;border-radius:12px;padding:14px 0;text-align:center}
.stats b{font-size:19px;display:block}
.stats span{font-size:12px;color:var(--ink2)}
.list{background:#fff;margin:12px;border-radius:12px}
.list .it{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.list .it:last-child{border:0}
.list .it span{flex:1}
.list .it small{color:var(--ink3);font-size:12px}

/* ---------- admin ---------- */
.admin{background:#fff;border:1px solid var(--admin-line);border-radius:14px;overflow:hidden}
.ad-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--admin-line);background:#FAFBFC;gap:10px;flex-wrap:wrap}
.ad-head h2{font-size:16px;display:flex;align-items:center;gap:8px}
.ad-head h2 small{font-size:12px;font-weight:400;color:#7b8794}
.reset{font-size:12px;color:#52606D;border:1px solid var(--admin-line);border-radius:6px;padding:4px 10px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px 0}
.kpi{border:1px solid var(--admin-line);border-radius:10px;padding:10px 12px}
.kpi span{font-size:12px;color:#7b8794}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.ad-tabs{display:flex;gap:4px;padding:14px 18px 0;border-bottom:1px solid var(--admin-line);overflow-x:auto}
.ad-tabs button{padding:8px 12px;font-size:13px;color:#52606D;border-bottom:2px solid transparent;white-space:nowrap}
.ad-tabs button.on{color:var(--admin-ink);font-weight:700;border-color:var(--wx)}
.ad-body{padding:16px 18px 20px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;background:#F7F9FA;border:1px solid var(--admin-line);border-radius:10px;padding:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#52606D}
.form input,.form select{height:34px;border:1px solid #CBD2D9;border-radius:6px;padding:0 8px;background:#fff;font-size:13px;min-width:0}
.form .go{height:34px;border-radius:6px;background:var(--wx);color:#fff;font-weight:600;font-size:13px}
.form-t{font-size:13px;font-weight:700;margin:16px 0 8px}
.form-t:first-child{margin-top:0}
.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--admin-line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{background:#F7F9FA;color:#52606D;font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--admin-line)}
td{padding:8px 10px;border-bottom:1px solid #F0F2F4}
tr:last-child td{border:0}
td .zh{font-family:var(--cn)}
.pill{display:inline-block;font-size:11px;border-radius:10px;padding:1px 8px;background:#F0F2F4;color:#52606D}
.pill.g{background:var(--wx-l);color:var(--wx-d)} .pill.o{background:var(--orange-l);color:var(--orange)}
.del{font-size:12px;color:#CF1124}
.flash{animation:flash 1.4s}
@keyframes flash{0%{background:#E8F8EF}100%{background:transparent}}
.ad-note{font-size:12px;color:#7b8794;margin-top:10px}

@media (max-width:1100px){
  .wrap{grid-template-columns:1fr}
  .phone-col{position:static}
}
@media (max-width:440px){
  .wrap{padding:0;gap:16px}
  .phone{width:100%;height:780px;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .admin{border-radius:0;border-left:0;border-right:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="band">SAMPLE · ZTW 시연용</div>
<div class="intro"><p>위챗 미니프로그램 화면 흐름 시연 — 실제 납품은 위챗 공식 개발도구(WXML/WXSS)로 개발</p></div>

<main class="wrap">
  <section class="phone-col" aria-label="미니프로그램 화면">
    <div class="phone"><div class="screen" id="screen">

  const el = e.target.closest('[data-tab],[data-cat],[data-shop],[data-area],[data-prod],[data-consult],[data-take],[data-seg],[data-cpd],[data-verify],[data-quick],[data-openchat]');
  if (!el) return; const d = el.dataset;
  if (d.take) { e.stopPropagation(); return take(d.take); }
  if (d.verify) return openVerify(d.verify);
  if (d.cpd) return go('cpd', {claim: d.cpd});
  if (d.tab) { if (d.tab === 'coupon') ui.seg = 'center'; return switchTab(d.tab); }
  if (d.cat) { if (d.cat === 'deal') { ui.seg = 'center'; return switchTab('coupon'); } ui.area = '全部'; return go('list', {cat: d.cat}); }
  if (d.shop) return go('detail', {shop: d.shop});
  if (d.area) { ui.area = d.area; return render(); }
  if (d.prod) { ui.prod[top_().shop] = +d.prod; return render(); }
  if (d.consult) return consult(top_().shop);
  if (d.seg) { ui.seg = d.seg; return render(true); }
  if (d.quick) return userSay(d.quick);
  if (d.openchat) return go('chat', {chat: d.openchat});
});
$('screen').addEventListener('submit', e => { if (e.target.id === 'chatform') { e.preventDefault(); const v = $('chatin').value; $('chatin').value = ''; userSay(v); } });

/* ---------- admin ---------- */
let adTab = 'tpl', flashId = null;
const AD_TABS = [['shop','업체·상품'],['tpl','할인권 발급'],['staff','직원 코드'],['log','사용 내역']];
const shopOpts = () => S.shops.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
const fl = id => id === flashId ? ' class="flash"' : '';
function renderAdmin(t) {
  if (t) adTab = t;
  const issued = S.tpls.reduce((a, t) => a + Number(t.qty), 0), claimed = S.claims.length, used = S.claims.filter(c => c.status === 'used').length;
  $('kpis').innerHTML = [['입점 업체', S.shops.length + '곳'],['발급 수량', issued.toLocaleString() + '장'],['수령', claimed + '장'],['사용(核销)', used + '장 · ' + (claimed ? Math.round(used / claimed * 100) : 0) + '%']].map(([k, v]) => `<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join('');
  $('adtabs').innerHTML = AD_TABS.map(([k, l]) => `<button class="${adTab===k?'on':''}" data-ad="${k}">${l}</button>`).join('');
  const B = {
    shop: () => `<div class="form-t">업체 등록</div>
      <form class="form" id="f-shop"><label>카테고리<select name="cat">${CATS.filter(c=>c.id!=='deal').map(c => `<option value="${c.id}">${c.ko} · ${c.zh}</option>`).join('')}</select></label>
      <label>업체명(중문)<input name="name" required placeholder="例：东大门·炸鸡啤酒"></label><label>지역(중문)<input name="area" required placeholder="例：东大门"></label>
      <label>주소(중문)<input name="addr" required placeholder="首尔中区…"></label><label>영업시간<input name="hours" required value="11:00–22:00"></label>
      <label>대표 상품명(중문)<input name="pname" required placeholder="例：双人炸鸡套餐"></label><label>가격(원)<input name="krw" type="number" min="1000" step="1000" required value="35000"></label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="rec" checked style="height:auto">首页 추천</label><button class="go">등록</button></form>
      <div class="form-t">상품 추가</div>
      <form class="form" id="f-prod"><label>업체<select name="shop">${shopOpts()}</select></label><label>상품명(중문)<input name="pname" required placeholder="例：套餐 B"></label><label>가격(원)<input name="krw" type="number" min="1000" step="1000" required value="50000"></label><button class="go">추가</button></form>
      <div class="tw"><table><thead><tr><th>업체</th><th>카테고리</th><th>지역</th><th>상품</th><th>최저가</th><th>추천</th></tr></thead><tbody>${S.shops.slice().reverse().map(s => `<tr${fl(s.id)}><td class="zh">${esc(s.name)}</td><td>${catOf(s.cat).ko}</td><td class="zh">${esc(s.area)}</td><td>${s.products.length}개</td><td>${won(minPrice(s))} <span style="color:#9aa5b1">(${cny(minPrice(s))})</span></td><td>${s.rec ? '<span class="pill g">추천</span>' : '-'}</td></tr>`).join('')}</tbody></table></div>`,
    tpl: () => `<div class="form-t">할인권 발급</div>
      <form class="form" id="f-tpl"><label>업체<select name="shop">${shopOpts()}</select></label><label>쿠폰명(중문)<input name="name" required value="新客专享立减"></label>
      <label>혜택 표기<input name="val" required value="减₩10,000"></label><label>사용 조건(중문)<input name="cond" required value="满₩50,000可用"></label>
      <label>수량<input name="qty" type="number" min="1" max="10000" required value="30"></label><label>유효기간(까지)<input name="until" type="date" required value="2026-12-31" min="${today()}"></label><button class="go">발급</button></form>
      <div class="ad-note">발급 즉시 왼쪽 미니프로그램 「优惠券 → 领券中心」과 首页 「限时领券」에 나타납니다.</div>
      <div class="tw"><table><thead><tr><th>쿠폰</th><th>업체</th><th>혜택</th><th>수량</th><th>수령</th><th>사용</th><th>잔여</th><th>유효기간</th><th>상태</th></tr></thead><tbody>${S.tpls.slice().reverse().map(t => { const u = S.claims.filter(c => c.tpl === t.id && c.status === 'used').length;
        return `<tr${fl(t.id)}><td class="zh">${esc(t.name)}</td><td class="zh">${esc(shopOf(t.shop)?.name || '-')}</td><td class="zh">${esc(t.val)}</td><td>${t.qty}</td><td>${claimedCount(t)}</td><td>${u}</td><td>${Math.max(left(t),0)}</td><td>~${t.until}</td><td>${expired(t) ? '<span class="pill">만료</span>' : left(t) <= 0 ? '<span class="pill o">소진</span>' : '<span class="pill g">진행중</span>'}</td></tr>`; }).join('')}</tbody></table></div>`,
    staff: () => `<div class="form-t">직원 고유 코드 등록</div>
      <form class="form" id="f-staff"><label>업체<select name="shop">${shopOpts()}</select></label><label>직원명<input name="name" required placeholder="예: 홍길동"></label>
      <label>코드(숫자 4자리)<input name="code" required pattern="\\d{4}" maxlength="4" inputmode="numeric" value="${String(Math.floor(1000 + Math.random() * 9000))}"></label><button class="go">등록</button></form>
      <div class="ad-note">매장 직원이 고객 휴대폰의 「门店核销」 화면에 이 코드를 입력하면 사용 완료 처리됩니다. 코드는 업체별로 구분되며, 다른 업체 코드로는 처리되지 않습니다.</div>
      <div class="tw"><table><thead><tr><th>업체</th><th>직원</th><th>코드</th><th>처리 건수</th><th></th></tr></thead><tbody>${S.staff.slice().reverse().map(x => `<tr${fl(x.id)}><td class="zh">${esc(shopOf(x.shop)?.name || '-')}</td><td>${esc(x.name)}</td><td><b style="font-variant-numeric:tabular-nums;letter-spacing:.1em">${esc(x.code)}</b></td><td>${S.claims.filter(c => c.staff === x.name).length}</td><td><button class="del" data-delstaff="${x.id}">삭제</button></td></tr>`).join('')}</tbody></table></div>`,
    log: () => `<div class="form-t">쿠폰 수령·사용 내역</div>
      <div class="tw"><table><thead><tr><th>쿠폰번호</th><th>쿠폰</th><th>업체</th><th>상태</th><th>수령</th><th>사용</th><th>확인 직원</th></tr></thead><tbody>${S.claims.slice().reverse().map(c => { const t = tplOf(c.tpl);
        return `<tr${fl(c.id)}><td><b style="font-variant-numeric:tabular-nums">${c.code}</b></td><td class="zh">${esc(t.name)}</td><td class="zh">${esc(shopOf(t.shop)?.name || '-')}</td><td>${c.status === 'used' ? '<span class="pill g">사용 완료</span>' : expired(t) ? '<span class="pill">만료</span>' : '<span class="pill o">미사용</span>'}</td><td>${c.claimedAt}</td><td>${c.usedAt || '-'}</td><td>${esc(c.staff || '-')}</td></tr>`; }).join('') || '<tr><td colspan="7" style="text-align:center;color:#9aa5b1">내역 없음</td></tr>'}</tbody></table></div>
      <div class="ad-note">자동 정산은 범위 밖 — 이 표를 엑셀로 내려받아 업체별로 정산하는 방식을 기본으로 둡니다.</div>`,
  };
  $('adbody').innerHTML = B[adTab]();
  flashId = null;
}
$('adtabs').addEventListener('click', e => { const b = e.target.closest('[data-ad]'); if (b) renderAdmin(b.dataset.ad); });
$('adbody').addEventListener('click', e => { const b = e.target.closest('[data-delstaff]'); if (b) { S.staff = S.staff.filter(x => x.id !== b.dataset.delstaff); save(); renderAdmin(); } });
$('adbody').addEventListener('submit', e => {
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const id = e.target.id;
  if (id === 'f-shop') { const s = {id: uid('s'), cat: f.cat, name: f.name.trim(), area: f.area.trim(), addr: f.addr.trim(), hours: f.hours.trim(), rate: 5.0, cnt: 0, tags: ['新入驻'], art: catOf(f.cat).art, rec: f.rec ? 1 : 0, products: [P(f.pname.trim(), +f.krw)]};
    S.shops.push(s); flashId = s.id; toast('新商家已上线'); }
  if (id === 'f-prod') { shopOf(f.shop).products.push(P(f.pname.trim(), +f.krw)); flashId = f.shop; toast('商品已更新'); }
  if (id === 'f-tpl') { const t = {id: uid('t'), shop: f.shop, name: f.name.trim(), val: f.val.trim(), cond: f.cond.trim(), qty: +f.qty, until: f.until};
    S.tpls.push(t); flashId = t.id; toast('有新的优惠券可领取'); }
  if (id === 'f-staff') { if (S.staff.some(x => x.shop === f.shop && x.code === f.code)) { alert('같은 업체에 이미 있는 코드입니다.'); return; }
    const x = {id: uid('st'), shop: f.shop, name: f.name.trim(), code: f.code}; S.staff.push(x); flashId = x.id; }
  save(); renderAdmin(); render();
});
$('reset').onclick = () => { S = SEED(); save(); ui = {area:'全部', seg:'center', prod:{}}; tab = 'home'; stack = [{v:'home'}]; render(true); renderAdmin('tpl'); };

render(true); renderAdmin();
})();
</script>
