<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오리파 뽑기 데모</title>
<style>
:root{--bg:#0f1020;--panel:#1a1c33;--line:#2c2f52;--tx:#eef0ff;--mu:#9aa0c8;--ac:#ffcc33;--ok:#3ddc97;--ng:#ff5d73}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-top:28px}
.sample{position:fixed;top:0;left:0;right:0;z-index:99;background:rgba(255,204,51,.18);color:#ffe9a8;text-align:center;font-size:12px;letter-spacing:.1em;padding:5px;backdrop-filter:blur(4px);pointer-events:none}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:28px;background:var(--bg);z-index:10}
.logo{font-weight:800;letter-spacing:-.02em}.logo b{color:var(--ac)}
.member{font-size:12px;color:var(--mu)}
nav{display:flex;gap:4px;overflow-x:auto;width:100%;max-width:560px}
nav button{flex:1 0 auto;background:none;border:1px solid var(--line);color:var(--mu);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.pack .art{height:120px;border-radius:10px;margin-bottom:10px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 8px #0008}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:#0006;border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mu);font-weight:500}
.btn{background:var(--ac);color:#111;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.soldout{color:var(--ng);font-weight:700}
.g-SSR{background:linear-gradient(135deg,#ff7ad9,#ffcc33,#5df2ff)}.g-SR{background:linear-gradient(135deg,#7b5cff,#ff5da2)}.g-R{background:linear-gradient(135deg,#2f80ed,#56ccf2)}.g-N{background:linear-gradient(135deg,#4b5563,#9ca3af)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:800;color:#111}
.card{width:130px;aspect-ratio:5/7;border-radius:10px;position:relative;overflow:hidden;color:#fff;padding:8px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 20px #0008}
.card svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.card .nm{position:relative;font-weight:800;font-size:13px;text-shadow:0 1px 4px #000}
.card .gr{position:relative;align-self:flex-end;background:#000a;padding:0 6px;border-radius:5px;font-size:12px;font-weight:800}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto}
.pg{border:2px dashed var(--ac);border-radius:12px;padding:12px;margin:10px 0;font-size:13px}
.notice{font-size:12px;color:var(--mu);background:#0004;border-radius:8px;padding:10px;margin-top:10px}
.flip{animation:flip .7s both}@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.shine.SSR{animation:flip .7s both,glow 1.2s .7s infinite alternate}@keyframes glow{to{box-shadow:0 0 30px #ffcc33,0 0 60px #ff7ad9}}
.packanim{width:150px;height:200px;margin:20px auto;border-radius:14px;animation:shake .9s ease-in-out}@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-6deg) scale(1.05)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg) scale(1.1)}80%{transform:scale(1.25);opacity:.6}}
input,select{background:#0006;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px;font:inherit;width:100%}
td input{width:80px}
.err{color:var(--ng);font-size:13px}.okc{color:var(--ok);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}.card{width:100px}nav button{padding:7px 8px;font-size:13px}.member{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="sample">SAMPLE · ZTW 시연용</div>
<header>
  <div class="logo">카드몰 <b>오리파</b></div>
  <div class="member" id="member"></div>
  <nav id="nav">
    <button data-v="packs" class="on">팩 목록</button>
    <button data-v="vault">내 보관함</button>
    <button data-v="ship">배송 신청 내역</button>
    <button data-v="admin">관리자</button>
  </nav>
</header>
<main id="view"></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const GRADES=['SSR','SR','R','N'];
const NAMES={SSR:['성운 드래곤','황금 불사조'],SR:['번개 늑대','심해 고래','얼음 여왕'],R:['숲의 사슴','바람 매','불꽃 여우','바위 거북'],N:['풀잎 요정','물방울','작은 돌','모래 게','구름 양']};
const SHAPES=['<circle cx="50" cy="50" r="30" fill="#fff"/>','<polygon points="50,12 88,88 12,88" fill="#fff"/>','<rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" fill="#fff"/>','<polygon points="50,8 61,38 94,38 67,58 78,90 50,70 22,90 33,58 6,38 39,38" fill="#fff"/>'];
const now=()=>new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const won=n=>n.toLocaleString('ko-KR')+'원';

function seed(){
  const mk=(id,name,price,total,probs)=>({id,name,price,total,on:true,grades:GRADES.map((g,i)=>({g,prob:probs[i],stock:Math.round(total*probs[i]/100)}))});
  return {packs:[mk('p1','스타터 오리파',3000,200,[1,4,25,70]),mk('p2','프리미엄 오리파',10000,100,[3,12,35,50]),mk('p3','한정 이벤트팩',5000,10,[10,20,30,40])],
    vault:[],ships:[],draws:[],logs:[{t:now(),who:'admin',msg:'초기 확률 등록 (데모 시드)'}]};
}
let S;try{S=JSON.parse(localStorage.getItem('oripa'))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem('oripa',JSON.stringify(S))}catch(e){}};
const left=p=>p.grades.reduce((a,x)=>a+x.stock,0);
// 재고 소진 시 자동 판매중지
const autoStop=p=>{if(left(p)===0&&p.on){p.on=false;S.logs.unshift({t:now(),who:'system',msg:`${p.name} 재고 소진 → 자동 판매중지`})}};

function cardHTML(c,cls=''){
  const sh=SHAPES[(c.name.length+GRADES.indexOf(c.g))%SHAPES.length];
  return `<div class="card g-${c.g} ${cls}"><svg viewBox="0 0 100 100">${sh}</svg><span class="nm">${c.name}</span><span class="gr">${c.g}</span></div>`;
}
document.getElementById('member').textContent='카페24 회원: demo_user (SSO 연결 지점)';

const V={
packs(){
  return `<h2>팩 목록</h2><div class="grid">${S.packs.map(p=>{const l=left(p);return `<div class="box pack">
   <div class="art g-${p.grades[0].stock?'SSR':'N'}">${p.name}</div>
   <div class="row"><b>${won(p.price)} / 1회</b><span class="mu">남은 ${l} / ${p.total}장</span></div>
   <div class="bar"><i style="width:${l/p.total*100}%"></i></div>
   <table><tr><th>등급</th><th>최초 확률</th><th>남은 수량</th><th>지금 확률</th></tr>
   ${p.grades.map(x=>`<tr><td><span class="tag g-${x.g}">${x.g}</span></td><td>${x.prob}%</td><td>${x.stock}</td><td>${l?(x.stock/l*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</table>
   <div class="row" style="margin-top:10px">${p.on?`<button class="btn" onclick="buy('${p.id}',1)">1회 뽑기</button><button class="btn ghost" onclick="buy('${p.id}',5)" ${l<5?'disabled':''}>5회 뽑기</button>`:'<span class="soldout">판매 종료 (재고 소진)</span>'}</div>
  </div>`}).join('')}</div>
  <div class="notice">모든 뽑기는 실물 카드 1장이 지급됩니다(꽝 없음). 지금 확률은 남은 수량 기준으로 뽑을 때마다 다시 계산됩니다. 확률 변경 이력은 관리자 화면에 기록됩니다.</div>`;
},
vault(){
  const items=S.vault.filter(v=>!v.ship);
  return `<h2>내 보관함 <span class="mu">${items.length}장 보관 중</span></h2>
  ${items.length?`<div class="cards">${items.map(v=>`<label style="text-align:center">${cardHTML(v)}<input type="checkbox" class="pick" value="${v.id}" style="width:auto;margin-top:6px"> 선택</label>`).join('')}</div>
  <div class="box" style="margin-top:14px"><h2>실물 배송 신청</h2><div class="two">
   <div><span class="mu">받는 분</span><input id="rcv" placeholder="홍길동"></div><div><span class="mu">주소</span><input id="addr" placeholder="서울시 ○○구 ○○로 1"></div></div>
   <p class="err" id="sherr"></p><button class="btn" onclick="ship()">선택 카드 배송 신청</button>
   <div class="notice">보관 기간 90일 경과 시 안내 후 일괄 배송 처리(규정 예시). 배송비 정책·미배송 보관분 처리 기준은 운영 정책에 맞춰 확정합니다.</div></div>`
  :'<div class="box mu">보관 중인 카드가 없습니다. 팩 목록에서 뽑아 보세요.</div>'}`;
},
ship(){
  return `<h2>배송 신청 내역</h2>${S.ships.length?`<div class="box"><table><tr><th>신청일</th><th>카드</th><th>상태</th></tr>${S.ships.map(s=>`<tr><td>${s.t}</td><td>${s.cards.length}장</td><td>${s.st}</td></tr>`).join('')}</table></div>`:'<div class="box mu">신청 내역이 없습니다.</div>'}`;
},
admin(){
  return `<h2>관리자</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${S.packs.map(p=>`<div class="box">
   <div class="row"><b>${p.name}</b><span class="${p.on?'okc':'soldout'}">${p.on?'판매중':'판매중지'}</span></div>
   <p class="mu">팩 총수량 ${p.total}장 · 남은 ${left(p)}장</p>
   <table><tr><th>등급</th><th>확률(%)</th><th>남은 재고</th></tr>
   ${p.grades.map((x,i)=>`<tr><td><span class="tag g-${x.g}">${x.g}</span></td><td><input type="number" step="0.1" min="0" id="pr-${p.id}-${i}" value="${x.prob}" oninput="chk('${p.id}')"></td><td><input type="number" min="0" id="st-${p.id}-${i}" value="${x.stock}"></td></tr>`).join('')}</table>
   <p id="sum-${p.id}"></p>
   <div class="row"><button class="btn" id="sv-${p.id}" onclick="saveP('${p.id}')">저장</button><button class="btn ghost" onclick="tog('${p.id}')">${p.on?'판매중지':'판매재개'}</button></div></div>`).join('')}</div>
  <div class="two" style="margin-top:14px">
   <div class="box"><h2>배송 신청 목록</h2>${S.ships.length?`<table><tr><th>신청일</th><th>받는 분</th><th>카드</th><th>상태</th></tr>${S.ships.map((s,i)=>`<tr><td>${s.t}</td><td>${s.rcv}</td><td>${s.cards.map(c=>c.g+' '+c.name).join(', ')}</td><td><select onchange="S.ships[${i}].st=this.value;save()">${['신청','포장중','발송완료'].map(o=>`<option ${o===s.st?'selected':''}>${o}</option>`).join('')}</select></td></tr>`).join('')}</table>`:'<p class="mu">없음</p>'}</div>
   <div class="box"><h2>당첨 내역</h2>${S.draws.length?`<table><tr><th>시각</th><th>팩</th><th>결과</th></tr>${S.draws.slice(0,30).map(d=>`<tr><td>${d.t}</td><td>${d.pack}</td><td><span class="tag g-${d.g}">${d.g}</span> ${d.name}</td></tr>`).join('')}</table>`:'<p class="mu">없음</p>'}</div>
  </div>
  <div class="box" style="margin-top:14px"><h2>확률·상태 변경 이력</h2><table><tr><th>시각</th><th>주체</th><th>내용</th></tr>${S.logs.map(l=>`<tr><td>${l.t}</td><td>${l.who}</td><td>${l.msg}</td></tr>`).join('')}</table></div>
  <p style="margin-top:14px"><button class="btn ghost" onclick="localStorage.removeItem('oripa');S=seed();go('admin')">데모 데이터 초기화</button></p>`;
}
};
let cur='packs';
function go(v){cur=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.getElementById('view').innerHTML=V[v]();if(v==='admin')S.packs.forEach(p=>chk(p.id));}
document.getElementById('nav').onclick=e=>{if(e.target.dataset.v)go(e.target.dataset.v)};

// 확률 합계 100% 검증
function chk(id){
  const sum=GRADES.reduce((a,_,i)=>a+(parseFloat(document.getElementById(`pr-${id}-${i}`).value)||0),0);
  const ok=Math.abs(sum-100)<1e-9, el=document.getElementById('sum-'+id);
  el.className=ok?'okc':'err';el.textContent=`확률 합계 ${+sum.toFixed(2)}% ${ok?'· 저장 가능':'· 100%가 되어야 저장됩니다'}`;
  document.getElementById('sv-'+id).disabled=!ok;
}
function saveP(id){
  const p=S.packs.find(x=>x.id===id),ch=[];
  p.grades.forEach((x,i)=>{
    const pr=+document.getElementById(`pr-${id}-${i}`).value, st=Math.max(0,parseInt(document.getElementById(`st-${id}-${i}`).value)||0);
    if(pr!==x.prob)ch.push(`${x.g} 확률 ${x.prob}%→${pr}%`);if(st!==x.stock)ch.push(`${x.g} 재고 ${x.stock}→${st}`);x.prob=pr;x.stock=st;
  });
  p.total=Math.max(p.total,left(p));
  if(ch.length)S.logs.unshift({t:now(),who:'admin',msg:`${p.name}: ${ch.join(', ')}`});
  autoStop(p);save();go('admin');
}
function tog(id){const p=S.packs.find(x=>x.id===id);if(!p.on&&left(p)===0)return alert('재고가 없어 판매를 재개할 수 없습니다.');p.on=!p.on;S.logs.unshift({t:now(),who:'admin',msg:`${p.name} ${p.on?'판매재개':'판매중지'}`});save();go('admin');}

const modal=document.getElementById('modal'),sheet=document.getElementById('sheet');
const closeM=()=>{modal.classList.remove('on');go(cur)};
function buy(id,n){
  const p=S.packs.find(x=>x.id===id);
  sheet.innerHTML=`<h2>${p.name} ${n}회 결제</h2><div class="row"><span>결제 금액</span><b>${won(p.price*n)}</b></div>
  <div class="pg"><b>스마트로 PG 결제창 연결 지점</b><br>운영 시 이 위치에서 스마트로 결제창이 열리고, 서버가 승인 결과를 검증한 뒤에만 뽑기가 실행됩니다. 데모는 실결제 없이 진행됩니다.</div>
  <div class="notice">구매하신 뽑기권은 미사용 상태에서 구매일로부터 7일 이내 청약철회가 가능합니다. 개봉(뽑기 실행) 후에는 결과 카드가 실물로 지급되며, 카드 하자 시 교환해 드립니다. 문구는 예시이며 확정 문구는 법률 검토 후 반영합니다.</div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="closeM()">취소</button><button class="btn" onclick="draw('${id}',${n})">결제 완료로 가정하고 뽑기</button></div>`;
  modal.classList.add('on');
}
// 남은 수량 기준 비복원 추출: 뽑을 때마다 해당 등급 재고 1 차감
function pick(p){
  let r=Math.random()*left(p);
  for(const x of p.grades){if(r<x.stock){x.stock--;const ns=NAMES[x.g];return {g:x.g,name:ns[Math.floor(Math.random()*ns.length)]}}r-=x.stock;}
}
function draw(id,n){
  const p=S.packs.find(x=>x.id===id);
  if(!p.on||left(p)<n){alert('남은 수량이 부족합니다.');return closeM();}
  const res=[];for(let i=0;i<n;i++){const c=pick(p);c.id=Date.now()+'-'+i;res.push(c);S.vault.unshift({...c});S.draws.unshift({t:now(),pack:p.name,...c});}
  autoStop(p);save();
  sheet.innerHTML=`<h2 style="text-align:center">개봉 중...</h2><div class="packanim g-SSR"></div>`;
  setTimeout(()=>{
    sheet.innerHTML=`<h2 style="text-align:center">결과</h2><div class="cards">${res.map((c,i)=>cardHTML(c,'flip shine '+c.g).replace('class="card','style="animation-delay:'+i*.25+'s" class="card')).join('')}</div>
    <p class="mu" style="text-align:center">카드는 내 보관함에 저장되었습니다.</p><div class="row" style="justify-content:center"><button class="btn ghost" onclick="closeM()">닫기</button><button class="btn" onclick="modal.classList.remove('on');go('vault')">보관함 보기</button></div>`;
  },950);
}
function ship(){
  const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value),rcv=document.getElementById('rcv').value.trim(),addr=document.getElementById('addr').value.trim(),er=document.getElementById('sherr');
  if(!ids.length)return er.textContent='배송할 카드를 선택해 주세요.';
  if(!rcv||!addr)return er.textContent='받는 분과 주소를 입력해 주세요.';
  const cards=S.vault.filter(v=>ids.includes(v.id));cards.forEach(c=>c.ship=true);
  S.ships.unshift({t:now(),rcv,addr,cards,st:'신청'});save();go('ship');
}
go('packs');
</script>
</body>
</html>
