<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1E9">
<title>편지 한 장 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%239A4A2E'/%3E%3Cpath d='M5 8h14v9H5z M5 8l7 5 7-5' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="notice">샘플 데모 · 실제 결제 없음 · 가상 데이터</div>
<nav class="switch" aria-label="화면 전환">
  <button type="button" data-pane="app" class="on">고객 앱</button>
  <button type="button" data-pane="admin">출력 관리자 <span class="dot" id="newDot" hidden></span></button>
</nav>
<main class="stage">
  <section class="pane pane-app on" id="paneApp" aria-label="고객 앱">
    <div class="pane-label">고객 앱 (안드로이드)</div>
    <div class="phone" id="app"></div>
  </section>
  <section class="pane pane-admin" id="paneAdmin" aria-label="출력 관리자">
    <div class="pane-label">관리자 화면 (PC · 프린터 연결)</div>
    <div class="admin" id="admin"></div>
  </section>
</main>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print" aria-hidden="true"></div>
<script src="app.js"></script>
</body>
</html>
