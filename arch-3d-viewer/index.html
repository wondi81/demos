<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>건축 3D 뷰어 데모</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232b5d8a'/%3E%3Cpath d='M5 10l7-4 7 4v8l-7 4-7-4z' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<header class="top">
  <div class="row">
    <h1>건축 3D 뷰어</h1>
    <span class="chip sample">샘플 데이터</span>
    <span class="chip mode" id="modeChip">편집 화면</span>
  </div>
  <p class="note">데모는 서버 없이 링크에 상태를 담습니다. 실제 납품은 서버 DB 저장 + 추측 불가 토큰 링크</p>
</header>

<main class="main">
  <div class="viewer" id="viewer">
    <div class="overlay" id="overlay">모델 불러오는 중…</div>
    <div class="hint" id="hint">벽이나 바닥을 눌러 선택하세요</div>
  </div>

  <aside class="panel" id="panel">
    <div id="panelBody"></div>
    <p class="meta" id="meta"></p>
  </aside>
</main>

<nav class="toolbar" id="toolbar">
  <button data-act="fit">전체 보기</button>
  <button data-act="top">위에서 보기</button>
  <button data-act="eye">눈높이 보기</button>
  <button data-act="open" class="edit-only">파일 열기</button>
  <button data-act="share" class="edit-only primary">저장·링크</button>
</nav>
<input type="file" id="file" accept=".obj,.dae" hidden>

<dialog id="dlg">
  <h2>링크가 만들어졌습니다</h2>
  <div id="dlgBody"></div>
  <form method="dialog"><button class="ghost">닫기</button></form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
